# What the real experiment will run. The harness that reads this file is not written yet.
# Until it is, the session scripts (scripts/lib.sh) keep their own copies of these values.

model: Qwen/Qwen3-8B
speculator: RedHatAI/Qwen3-8B-speculator.eagle3
vllm_version: 0.33.0
max_model_len: 4096

# Server settings every arm shares. Session 1 used the first two (see scripts/lib.sh).
server:
  max_num_seqs: 64
  gpu_memory_utilization: 0.90
  prefix_caching: false          # decided 25 Nov 2026: off for every arm. Session 1 ran with it on (F-005)
  max_num_batched_tokens: null   # not decided: one explicit value for every arm (F-005)

# The four configurations. "off" means no speculative config at all.
arms:
  off: {}
  k1: {k: 1}
  k3: {k: 3}
  dynamic: {table: from_profile}

# Two workloads. The profile one is used to build the Dynamic SD table.
# The held-out one is only used to test it.
workloads:
  profile:
    dataset: null
    num_prompts: null
    rates: [null, null, null, null]   # requests per second
  heldout:
    dataset: null
    num_prompts: null
    rates: [null, null]

repeats: 2
temperature: 0

# What counts as "fast enough" when I measure goodput.
goodput_target:
  ttft_ms: null
  tpot_ms: null

# When I will say Dynamic SD hurt.
harm_rule:
  worse_than_off_by_more_than_percent: 2
  needs_non_overlapping_ci: true

budget:
  hard_cap_usd: null            # my own limit, set before the first paid run
  gpu_price_per_hour_usd: 0.59   # RunPod public list price for the A40 (12 Nov 2026); confirm in the console at deploy
  max_session_hours: 3           # stop the pod by then, whatever has finished
